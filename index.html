<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>베르넬</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="game"></div>
  <div id="overlay"></div>
  <div id="boss-alert" class="hidden"></div>

  <div id="hud" class="hidden">
    <div id="player-frame" class="panel stitched">
      <div class="pf-top"><span id="pf-name"></span><span id="pf-level" class="badge"></span></div>
      <div id="pf-class" class="pf-class"></div>
      <div class="bar hp"><div class="fill" id="pf-hp"></div><span id="pf-hp-text"></span></div>
      <div id="pf-res"></div>
      <div id="pf-gold"></div>
    </div>

    <div id="target-frame" class="panel stitched hidden">
      <div class="tf-top"><span id="tf-name"></span><span id="tf-level" class="badge"></span></div>
      <div id="tf-kind" class="tf-kind"></div>
      <div class="bar hp"><div class="fill" id="tf-hp"></div><span id="tf-hp-text"></span></div>
      <div id="tf-stagger" class="bar stagger hidden"><div class="fill" id="tf-stg"></div><span id="tf-stg-text"></span></div>
    </div>

    <div id="minimap-wrap" class="panel stitched">
      <div id="zone-name">하르벤 교역 거점</div>
      <canvas id="minimap" width="176" height="176"></canvas>
      <div id="coords"></div>
    </div>

    <div id="right-col">
      <div id="public-panel" class="panel stitched"></div>
      <div id="quest-tracker" class="panel stitched"></div>
    </div>

    <div id="log-wrap" class="panel stitched">
      <div id="log-tabs"><span class="tab active">전체</span><span class="tab disabled" title="멀티플레이 준비 중">파티</span><span class="tab disabled" title="멀티플레이 준비 중">길드</span></div>
      <div id="log"></div>
      <input id="chat-input" maxlength="120" placeholder="Enter: 채팅 (지금은 혼자만 들립니다)" autocomplete="off" />
    </div>

    <div id="bottom">
      <div id="channel" class="hidden"><div id="channel-fill"></div><span id="channel-text"></span></div>
      <div id="skillbar"></div>
      <div id="xp-bar"><div id="xp-fill"></div><span id="xp-text"></span></div>
    </div>

    <div id="inventory" class="panel stitched hidden"></div>
    <div id="shop" class="panel stitched hidden"></div>
    <div id="itemtip" class="hidden"></div>
    <div id="summary" class="panel stitched hidden"></div>
    <div id="bonds" class="panel stitched hidden"></div>
    <div id="worldmap" class="hidden"><canvas id="worldmap-canvas"></canvas><div id="worldmap-legend"></div><div class="wm-hint">휠: 확대 · 드래그: 이동 · 클릭: 목적지 표시 (다시 클릭하면 해제) · M/Esc: 닫기 — 게임은 멈추지 않습니다</div></div>
    <div id="waypoint-arrow" class="hidden">➤<span></span></div>
    <div id="clock"></div>
    <div id="stamina"><div id="stamina-fill"></div></div>
    <div id="keyhint"></div>
    <div id="banner" class="hidden"></div>
    <div id="toast"></div>
    <div id="death-screen" class="hidden">쓰러졌습니다<small>잠시 후 거점 진료소 앞에서 깨어납니다. 잃는 것은 없습니다.</small></div>
  </div>

  <div id="dialog" class="hidden">
    <div class="dlg-box stitched">
      <div class="dlg-head"><span id="dlg-name"></span><span id="dlg-title"></span></div>
      <div id="dlg-rel" class="hidden"></div>
      <div id="dlg-text"></div>
      <div id="dlg-terms" class="hidden"></div>
      <div id="dlg-options"></div>
      <div class="dlg-hint">클릭 또는 Space로 계속</div>
    </div>
  </div>

  <div id="title">
    <div class="title-threads"></div>
    <div class="title-inner">
      <div class="title-sub">하르벤 계곡 · 903년</div>
      <h1>베르넬</h1>
      <div class="title-tag">길을 여는 사람들</div>
      <div id="title-continue" class="title-form stitched hidden">
        <div id="continue-info"></div>
        <button id="continue-btn" class="primary">이어하기</button>
        <button id="new-btn" class="link">새 캐릭터 만들기</button>
      </div>
      <div id="title-create" class="title-form create stitched hidden">
        <div id="migrate-note" class="note hidden"></div>
        <div class="create-body"><div>
        <label for="name-input">이름</label>
        <input id="name-input" maxlength="12" placeholder="이름을 입력하세요" autocomplete="off" />
        <label>출신 <small>전투 능력은 같습니다. 시작 소지품과 소개만 달라집니다.</small></label>
        <div id="origin-list" class="choice-list"></div>
        <label>전투 직업 <small>싸우는 방식입니다. 성격은 당신이 정합니다. 거점에서 언제든 바꿀 수 있습니다.</small></label>
        <div id="class-list" class="choice-list classes"></div>
        </div><div id="turntable"><span class="cap" id="turntable-cap"></span></div></div>
        <button id="start-btn" class="primary">하르벤으로 간다</button>
      </div>
      <div class="title-foot">우클릭/좌클릭 이동 · 좌클릭 적 연타 · Q W E R / A S D F 기술 · V 각성기 · Space 구르기 · G 상호작용 · F2 WASD 배치</div>
    </div>
    <div id="loading">하르벤 계곡을 짜는 중…</div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
